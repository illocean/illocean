<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="illocean — IT student, full-stack developer in training">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#8be9fd"/>
      <stop offset="1" stop-color="#bd93f9"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8be9fd"/>
      <stop offset="1" stop-color="#bd93f9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#30363d"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)" opacity="0.5"/>

  <!-- terminal window -->
  <rect x="44" y="44" width="470" height="232" rx="12" fill="#010409" stroke="#30363d" stroke-width="1.5"/>
  <rect x="44" y="44" width="470" height="34" rx="12" fill="#161b22"/>
  <rect x="44" y="66" width="470" height="12" fill="#161b22"/>
  <circle cx="66" cy="61" r="5" fill="#ff5f56"/>
  <circle cx="84" cy="61" r="5" fill="#ffbd2e"/>
  <circle cx="102" cy="61" r="5" fill="#27c93f"/>
  <text x="128" y="66" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" fill="#8b949e">~/profile</text>

  <g font-family="'SFMono-Regular', Consolas, monospace" font-size="18">
    <text x="70" y="120" fill="#8b949e"><tspan fill="#58a6ff">$</tspan> whoami</text>
    <text x="70" y="150" fill="#e6edf3">illocean</text>
    <text x="70" y="190" fill="#8b949e"><tspan fill="#58a6ff">$</tspan> cat stack.txt</text>
    <text x="70" y="220" fill="#8be9fd">laravel · livewire · filament</text>
    <text x="70" y="246" fill="#bd93f9">postgresql · mysql · sqlite</text>
    <text x="70" y="272" fill="#50fa7b">php · python · java · cobol</text>
  </g>
  <rect x="70" y="284" width="11" height="22" fill="#8be9fd" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- name + tagline -->
  <text x="560" y="130" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="74" font-weight="800" fill="url(#accent)" letter-spacing="-2">illocean</text>
  <rect x="562" y="152" width="330" height="4" rx="2" fill="url(#rule)"/>
  <text x="560" y="200" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#8b949e">IT student @ PUP Taguig</text>
  <text x="560" y="234" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#8b949e">Full-stack developer in training</text>
  <text x="560" y="278" font-family="'SFMono-Regular', Consolas, monospace" font-size="15" fill="#6e7681">large language models · agentic tooling</text>
</svg>
