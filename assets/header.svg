<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="illocean">
  <defs>
    <style>
      .bg   { fill: #000000 }
      .panel{ fill: #0a0a0b }
      .border{ fill: none; stroke: #272c36; stroke-width: 1 }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #e6e6e6 }
      .dim  { fill: #7d8590 }
      .cap  { fill: #ffffff }
      .tag  { fill: #ffffff; font-weight: 700; text-transform: uppercase }
      .hl   { fill: #d29922 }
    </style>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#000"/>
      <circle cx="7" cy="7" r="1" fill="#101012"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="#000"/>
  <rect x="90" y="44" width="1020" height="292" rx="6" class="panel"/>
  <rect x="90" y="44" width="1020" height="292" rx="6" class="border"/>

  <rect x="90" y="44" width="1020" height="292" fill="url(#dots)" opacity="0.6"/>

  <text x="150" y="118" class="cap" font-size="58" font-weight="800" letter-spacing="6">ILLOCEAN</text>
  <text x="150" y="146" class="tag" font-size="15">DEVOUR DIGITAL WASTE, BUILD CLEAN TOOLS</text>

  <rect x="150" y="176" width="420" height="132" rx="4" fill="#050506" stroke="#272c36" stroke-width="1"/>
  <text x="174" y="206" class="mono" font-size="13">PROJECTS   bakunawa, gif-terminal, lunar-mcp</text>
  <text x="174" y="226" class="mono" font-size="13">LANGUAGES  php, python, java, cobol</text>
  <text x="174" y="246" class="mono" font-size="13">STACK      laravel, spring, postgresql, alpine</text>
  <text x="174" y="266" class="mono" font-size="13">TOOLS      mcp, agentic-orchestration, tui</text>
  <text x="174" y="296" class="dim" font-size="13">status     <tspan class="hl">active</tspan></text>

  <text x="620" y="330" class="dim" font-size="13">1/L  languages   2/F  frameworks   3/D  databases   4/A  ai+workflow</text>

  <rect x="144" y="110" width="10" height="18" fill="#d29922">
    <animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite"/>
  </rect>
</svg>
